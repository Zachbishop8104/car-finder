name: Feature request
description: Suggest something Car Finder should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation or question you couldn't get an answer to. A real example helps more than a description of a feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working. A command or an example of the output is ideal.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with the project
      description: These aren't deal-breakers, but they shape what can be accepted.
      options:
        - label: It works with the Python standard library only
        - label: It doesn't spend Marketcheck API calls without the user knowing
